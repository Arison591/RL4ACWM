[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "tempflow-video"
version = "0.1.0"
description = "Standalone TempFlow-GRPO training layer for a pinned GE-Sim/AWM policy"
requires-python = ">=3.10"
dependencies = ["numpy>=1.24", "PyYAML>=6", "torch>=2.1"]

[project.optional-dependencies]
test = ["pytest>=7"]
video = ["opencv-python>=4.8"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

