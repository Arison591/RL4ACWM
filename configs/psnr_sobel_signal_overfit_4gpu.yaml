base_config: ${TEMPFLOW_STANDALONE_ROOT}/configs/psnr_signal_overfit_4gpu.yaml
output_dir: ${TEMPFLOW_OUTPUT_ROOT}/psnr_sobel_signal_overfit_4gpu

experiment:
  name: psnr_sobel_signal_overfit_4gpu

optimizer:
  learning_rate: 1.0e-5
  reference_kl_beta: 0.5
  ppo_ratio_mode: scalar_mean

reward:
  # Edge supervision uses the same three views and future-frame interval as PSNR.
  sobel_enabled: true
  sobel_charbonnier_epsilon: 0.001

reward_fusion:
  mode: psnr_sobel
  lambda_psnr: 0.80
  lambda_sobel: 0.20

  # Fixed from five 12-rollout validation groups on the overfit condition.
  # Observed median stds were 0.2445 dB (PSNR) and 0.0004395 (Sobel);
  # Sobel keeps the validated noise floor instead of amplifying sub-floor spread.
  psnr_scale_db: 0.25
  sobel_scale: 0.0005
  psnr_scale_floor_db: 0.005
  sobel_scale_floor: 0.0005
  fused_min_group_std: 1.0e-8
  advantage_clip: 5.0
