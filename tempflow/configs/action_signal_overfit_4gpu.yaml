base_config: ${TEMPFLOW_STANDALONE_ROOT}/configs/psnr_only_overfit224_4gpu.yaml
output_dir: ${TEMPFLOW_OUTPUT_ROOT}/action_signal_overfit_4gpu
max_optimizer_steps: 100

experiment:
  name: action_signal_overfit_4gpu
  mode: tempflow_full

dataset:
  include_samples: ["${TEMPFLOW_OVERFIT_CONDITION_ID}"]
  expected_num_samples: 1
  limit: 0

model:
  # The model bundle is stored directly under this root on the training host.
  checkpoint_root: ${TEMPFLOW_MODEL_ROOT}

rollout:
  group_size: 12

tempflow:
  branch_factor: 12
  branch_timesteps: [2]

optimizer:
  learning_rate: 3.0e-4
  reference_kl_beta: 0.5
  ppo_ratio_mode: scalar_mean
  log_gradient_cosine: true

reward:
  # Use the pinned AWM-CoCA action reward without PSNR geometry.
  mode: action
  geometry_enabled: false
  action_metric_weights:
    mean_iou: 0.1
    af_fdce_ate_norm: 0.7
    fdce: 0.2
  action_weight: 1.0
  geometry_weight: 0.0
  min_valid_seeds_per_group: 2

reward_fusion:
  mode: action_only
  advantage_clip: 5.0
  # This threshold is applied to the scalar terminal action reward by the
  # unchanged TempFlow runner; retain the same gate used by the PSNR run.
  psnr_min_group_std_db: 0.005

training:
  max_optimizer_steps: 100
  max_rollout_epochs: 100
  optimizer_minibatches_per_rollout_epoch: 1
  num_inner_epochs: 2
  shuffle_rollout_buffer: false
  checkpoint_every: 10

evaluation:
  fixed_samples: 1
  fixed_generation_seeds: [123456, 12345678]
  # Fixed evaluation is rank-0-only in the legacy runner.  Action/SAM3 can
  # touch its own distributed state, so keep training-time reward evaluation
  # fully synchronized across all four ranks and use the standalone baseline
  # run for comparison.
  evaluate_before_training: false
  every_optimizer_steps: 0
